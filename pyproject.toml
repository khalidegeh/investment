[project]
name = "tradingsystem"
version = "0.1.0"
description = "Reliable algorithmic trading research + paper trading base (CRA-aware ledger)"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = []

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
