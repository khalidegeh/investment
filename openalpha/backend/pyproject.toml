[project]
name = "openalpha"
version = "0.2.0"
description = "Self-hosted, zero-license quantitative research workspace"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.0",
    "numpy>=1.26",
    "typing_extensions>=4.5",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "pyarrow>=15",
    "defusedxml>=0.7",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
data = ["yfinance>=0.2.40"]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.4", "pandas-stubs"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers -q"
filterwarnings = ["error::ResourceWarning"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "defusedxml", "defusedxml.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Explicit so results do not depend on a ruff release's default rule set.
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "DTZ", "PYI", "ISC"]
